    <text x="136" y="175" fill="#6e7781" font-size="10.5">completions · diagnostics · editor workflows</text>

    <rect x="428" y="94" width="384" height="103" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
