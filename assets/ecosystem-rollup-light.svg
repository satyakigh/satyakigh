<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Open-source contribution areas</title>
  <desc id="description">Public merged pull requests grouped into authoring and language tools, validation and policy, CDK and IDE tooling, and schemas, agents, and RFCs.</desc>

