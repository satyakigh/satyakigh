<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Satyaki Ghosh's open-source contribution areas</title>
  <desc id="description">Public merged pull requests grouped into authoring and language tools, validation and policy, CDK and IDE tooling, and schemas, agents, and RFCs.</desc>

  <rect width="1200" height="500" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="15.5" fill="none" stroke="#d0d7de"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="54" y="52" fill="#1f2328" font-size="25" font-weight="700">Contribution areas</text>
    <text x="54" y="80" fill="#59636e" font-size="15">Selected public work across AWS open source</text>
    <text x="1146" y="53" text-anchor="end" fill="#1f2328" font-size="28" font-weight="700">600+</text>
    <text x="1146" y="80" text-anchor="end" fill="#59636e" font-size="13">merged pull requests</text>
    <path d="M54 106H1146" stroke="#d8dee4"/>

    <g>
      <rect x="54" y="128" width="535" height="140" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="54" y="128" width="535" height="4" rx="2" fill="#bc6f00"/>
      <text x="82" y="193" fill="#7d4e00" font-size="35" font-weight="700">310+</text>
      <text x="190" y="172" fill="#1f2328" font-size="18" font-weight="700">Authoring and language tools</text>
      <text x="190" y="200" fill="#59636e" font-size="13.5">Language Server · CloudFormation VS Code</text>
      <text x="190" y="229" fill="#6e7781" font-size="12">completions · diagnostics · editor workflows</text>

      <rect x="611" y="128" width="535" height="140" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="611" y="128" width="535" height="4" rx="2" fill="#9a6700"/>
      <text x="639" y="193" fill="#7d4e00" font-size="35" font-weight="700">270+</text>
      <text x="747" y="172" fill="#1f2328" font-size="18" font-weight="700">Validation and policy</text>
      <text x="747" y="200" fill="#59636e" font-size="13.5">Validate · Guard · cfn-lint</text>
      <text x="747" y="229" fill="#6e7781" font-size="12">schema checks · source locations · policy rules</text>

      <rect x="54" y="290" width="535" height="140" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="54" y="290" width="535" height="4" rx="2" fill="#0969da"/>
      <text x="82" y="355" fill="#0550ae" font-size="35" font-weight="700">15+</text>
      <text x="190" y="334" fill="#1f2328" font-size="18" font-weight="700">CDK and IDE tooling</text>
      <text x="190" y="362" fill="#59636e" font-size="13.5">AWS CDK · VS Code Toolkit · JetBrains Toolkit</text>
      <text x="190" y="391" fill="#6e7781" font-size="12">infrastructure APIs · developer workflows</text>

      <rect x="611" y="290" width="535" height="140" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
      <rect x="611" y="290" width="535" height="4" rx="2" fill="#57606a"/>
      <text x="639" y="355" fill="#57606a" font-size="35" font-weight="700">5+</text>
      <text x="747" y="334" fill="#1f2328" font-size="18" font-weight="700">Schemas, agents, and RFCs</text>
      <text x="747" y="362" fill="#59636e" font-size="13.5">Enhanced Schemas · Agent Toolkit · CDK RFCs</text>
      <text x="747" y="391" fill="#6e7781" font-size="12">resource models · agent tools · API design</text>
