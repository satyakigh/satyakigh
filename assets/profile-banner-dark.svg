<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Satyaki Ghosh</title>
  <desc id="description">Software Engineer working on AWS infrastructure as code, CloudFormation, developer tooling, and open source.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="65%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#ff9900" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#30363d" stroke-width="1" opacity="0.56"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="#0d1117"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="28" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="340" rx="4" fill="url(#accent)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="94" fill="#f0f6fc" font-size="54" font-weight="700" letter-spacing="-1.6">Satyaki Ghosh</text>
    <text x="66" y="136" fill="#8b949e" font-size="22" font-weight="600">Software Engineer · AWS Infrastructure as Code</text>
    <text x="66" y="184" fill="#c9d1d9" font-size="20">Building developer tools for CloudFormation,</text>
    <text x="66" y="213" fill="#c9d1d9" font-size="20">validation, and IDE workflows.</text>

    <g font-size="14" font-weight="600">
      <rect x="66" y="252" width="146" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <circle cx="84" cy="269" r="5" fill="#ff9900"/>
      <text x="98" y="274" fill="#f0f6fc">CloudFormation</text>

      <rect x="224" y="252" width="156" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <circle cx="242" cy="269" r="5" fill="#58a6ff"/>
      <text x="256" y="274" fill="#f0f6fc">Developer Tooling</text>

      <rect x="392" y="252" width="124" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <circle cx="410" cy="269" r="5" fill="#3fb950"/>
      <text x="424" y="274" fill="#f0f6fc">Open Source</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="48" width="350" height="244" rx="18" fill="#161b22" stroke="#30363d"/>
    <path d="M790 92H1140" stroke="#30363d"/>
    <circle cx="816" cy="70" r="6" fill="#ff7b72"/>
    <circle cx="838" cy="70" r="6" fill="#d29922"/>
    <circle cx="860" cy="70" r="6" fill="#3fb950"/>
    <text x="1086" y="75" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">BUILD</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <text x="820" y="128" fill="#ff7b72">template</text>
      <text x="906" y="128" fill="#8b949e">→</text>
      <text x="932" y="128" fill="#58a6ff">understand</text>

      <text x="820" y="172" fill="#d2a8ff">validate</text>
      <text x="906" y="172" fill="#8b949e">→</text>
      <text x="932" y="172" fill="#3fb950">diagnose</text>

      <text x="820" y="216" fill="#58a6ff">diagnostic</text>
      <text x="916" y="216" fill="#8b949e">→</text>
      <text x="942" y="216" fill="#ffa657">fix</text>

      <text x="820" y="260" fill="#3fb950">commit</text>
      <text x="887" y="260" fill="#8b949e">→</text>
      <text x="913" y="260" fill="#58a6ff">ship</text>
      <rect x="956" y="246" width="9" height="18" rx="2" fill="#ff9900" opacity="0.9"/>
    </g>
  </g>
</svg>
